name: User story
description: A new page, feature or content change.
labels: [story]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      value: |
        As a <type of visitor>
        I want <goal>
        So that <benefit>
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Written as scenarios that can become automated tests.
      value: |
        Scenario: <name>
          Given <context>
          When <action>
          Then <outcome>
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Test notes
      description: Risks, edge cases, test levels that should cover this (unit, E2E, visual, accessibility).
