name: Bug report
description: Something on the site is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, version, device and viewport size.
      placeholder: Firefox 131, macOS, 1440x900
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (site down or page unusable)
        - Major (feature broken, no workaround)
        - Minor (feature broken, workaround exists)
        - Trivial (cosmetic)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs or traces
