name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      # Results for the /quality page, picked up by the deploy job.
      - run: cp coverage/coverage-summary.json reports/
      - uses: actions/upload-artifact@v7
        with:
          name: quality-report-unit
          path: reports/
          retention-days: 14

  # The E2E jobs run in the official Playwright image, which ships the browsers and their system
  # packages. Installing them on the runner downloaded from a slow apt mirror and could take over
  # ten minutes. The image tag follows the locked @playwright/test version, so they never drift.
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Firefox refuses to run as root with a HOME it does not own; 1001 is the runner user.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Phones run in the job of the engine they emulate, reusing its browser install.
        include:
          - browser: chromium
            mobile: mobile-chrome
          - browser: webkit
            mobile: mobile-safari
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          E2E_REPORT_FILE: reports/e2e-${{ matrix.browser }}.json
      # Runs even when the desktop tests fail, so one run shows both.
      - if: ${{ !cancelled() && matrix.mobile }}
        run: npm run test:e2e -- --project=${{ matrix.mobile }}
        env:
          E2E_REPORT_FILE: reports/e2e-${{ matrix.mobile }}.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-mobile
      - uses: actions/upload-artifact@v7
        with:
          name: quality-report-e2e-${{ matrix.browser }}
          path: reports/
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            playwright-report-mobile/
          retention-days: 14

  lighthouse:
    name: Lighthouse (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Each audit takes about ten seconds, so the pages are shared between three jobs.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Audits each of its pages three times and fails below 95 in any category (see lighthouserc.json).
      - run: npm run test:lighthouse
        env:
          LIGHTHOUSE_SHARD: ${{ matrix.shard }}/3
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report-${{ matrix.shard }}
          path: lighthouse-report/
          retention-days: 14
      - run: mkdir -p reports && cp lighthouse-report/manifest.json reports/lighthouse-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: quality-report-lighthouse-${{ matrix.shard }}
          path: reports/
          retention-days: 14

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:links
        env:
          LINKS_REPORT_FILE: reports/links.json
          # Links to files in this repository are checked at the commit under test, not on main.
          LINKS_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: quality-report-links
          path: reports/
          retention-days: 14

  # Only a green build on main reaches production.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e, lighthouse, links]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The /quality page shows the results of this run; the build fails if any are missing.
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-report-*
          path: reports/
          merge-multiple: true
      # The trend on /quality: the live site publishes its deploy history and this build adds
      # itself to it. A 404 means no history yet (the first deploy); any other error stops the
      # deploy rather than start the history over. The query skips the Pages cache.
      - name: Download the deploy history
        env:
          HISTORY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/quality-history.json?run=${{ github.run_id }}
        run: |
          status=$(curl -sS -o reports/history.json -w '%{http_code}' "$HISTORY_URL")
          echo "History download: HTTP $status"
          if [ "$status" = 404 ]; then rm reports/history.json; elif [ "$status" != 200 ]; then exit 1; fi
      - run: npm run build
        env:
          REQUIRE_QUALITY_REPORT: 'true'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Smoke test the live site
    needs: [deploy, playwright-version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project=chromium --project=mobile-chrome
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
