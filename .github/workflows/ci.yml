name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      # Results for the /quality page, picked up by the deploy job.
      - run: cp coverage/coverage-summary.json reports/
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report-unit
          path: reports/
          retention-days: 14

  e2e:
    name: End-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          E2E_REPORT_FILE: reports/e2e-${{ matrix.browser }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report-e2e-${{ matrix.browser }}
          path: reports/
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Audits every page three times and fails below 95 in any category (see lighthouserc.json).
      - run: npm run test:lighthouse
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
      - run: mkdir -p reports && cp lighthouse-report/manifest.json reports/lighthouse.json
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report-lighthouse
          path: reports/
          retention-days: 14

  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:links
        env:
          LINKS_REPORT_FILE: reports/links.json
          # Links to files in this repository are checked at the commit under test, not on main.
          LINKS_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report-links
          path: reports/
          retention-days: 14

  # Only a green build on main reaches production.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, e2e, lighthouse, links]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The /quality page shows the results of this run; the build fails if any are missing.
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-report-*
          path: reports/
          merge-multiple: true
      - run: npm run build
        env:
          REQUIRE_QUALITY_REPORT: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
